<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escrow Protocol Game v1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; max-width: 800px; margin: 0 auto; padding: 24px; }
h1 { font-size: 1.5rem; margin-bottom: 16px; color: #58a6ff; }
h2 { font-size: 1.1rem; margin: 16px 0 8px; color: #8b949e; }
.modes { display: flex; gap: 8px; margin-bottom: 16px; }
button { padding: 8px 16px; border: 1px solid #30363d; border-radius: 6px; background: #21262d; color: #c9d1d9; cursor: pointer; font-size: 0.9rem; }
button:hover { background: #30363d; }
button.active { border-color: #58a6ff; background: #1f3a5f; }
.output { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; min-height: 200px; font-family: 'SF Mono', Consolas, monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }
.status { margin-top: 8px; font-size: 0.8rem; color: #8b949e; }
</style>
</head>
<body>
<h1>Escrow Protocol Game v1</h1>
<p style="margin-bottom:16px;color:#8b949e;">Three modes sharing one engine: EscrowSimulator</p>
<div class="modes">
<button id="btn-tuning" class="active" onclick="runMode('tuning')">Tuning</button>
<button id="btn-adversarial" onclick="runMode('adversarial')">Adversarial</button>
<button id="btn-compose" onclick="runMode('compose')">Compose</button>
</div>
<div class="output" id="output">Click a mode to run the simulation...</div>
<div class="status" id="status">Ready</div>

<script src="engine.js"></script>
<script>
function runMode(mode) {
  document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + mode).classList.add('active');
  const output = document.getElementById('output');
  const status = document.getElementById('status');
  let result;
  try {
    switch (mode) {
      case 'tuning': result = tuningGame(); break;
      case 'adversarial': result = adversarialGame(); break;
      case 'compose': result = composeGame(); break;
    }
    output.textContent = JSON.stringify(result, null, 2);
    status.textContent = '\u2713 ' + mode + ' complete - ' + result.length + ' entries';
  } catch (e) {
    output.textContent = 'Error: ' + e.message;
    status.textContent = '\u2717 failed';
  }
}
runMode('tuning');
</script>
</body>
</html>
